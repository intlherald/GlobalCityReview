name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare API token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not configured; skipping Cloudflare deploy."

      - name: Checkout
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          GITEA_TOKEN: ${{ github.token }}
          REPOSITORY_URL: http://10.144.144.2:3333/yunhai/GlobalCityReview.git
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin "${REPOSITORY_URL}"
          git -c http.extraheader="Authorization: token ${GITEA_TOKEN}" fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Install Bun
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm install --global bun@1.3.13

      - name: Install dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          BUN_FEATURE_FLAG_DISABLE_STREAMING_INSTALL: "1"
        run: bun install --frozen-lockfile

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
